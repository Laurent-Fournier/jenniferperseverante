<!-- Services -->
<section class="section section-lg section-light">
  <div class="container">
    <div class="row row-50">
      <div class="col-12 text-center">
        <h3>{{labels.TESTIMONIALS_TITLE|safe}}</h3>
        <img class="d-block mx-auto" src="/static/images/separator-loop.svg">
        <p class="font-weight-bold">{{labels.TESTIMONIALS_CHAPO}}</p>
      </div>
      <div class="col-md-6 col-lg-4 wow-outer">
        <div class="wow fadeInUp">
          <div class="post-modern">
            <div class="post-modern-caption section-medium">
              <img src="/images/370/{{labels.TESTIMONY_1_PHOTO}}" class="rounded-circle" width="100"
                alt="{{labels.TESTIMONY_1_NAME}}">
              <h5 class="post-modern-title">{{labels.TESTIMONY_1_NAME}}</h5>
              <div class="post-modern-text">{{labels.TESTIMONY_1_TEXT|safe}}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4 wow-outer">
        <div class="wow slideInDown">
          <div class="post-modern">
            <div class="post-modern-caption section-medium">
              <img src="/images/370/{{labels.TESTIMONY_2_PHOTO}}" class="rounded-circle" width="100"
                alt="{{labels.TESTIMONY_2_NAME}}">
              <h5 class="post-modern-title">{{labels.TESTIMONY_2_NAME}}</h5>
              <div class="post-modern-text">{{labels.TESTIMONY_2_TEXT|safe}}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4 wow-outer">
        <div class="wow fadeInUp">
          <div class="post-modern">
            <div class="post-modern-caption section-medium">
              <img src="/images/370/{{labels.TESTIMONY_3_PHOTO}}" class="rounded-circle" width="100"
                alt="{{labels.TESTIMONY_3_NAME}}">
              <h5 class="post-modern-title">{{labels.TESTIMONY_3_NAME}}</h5>
              <div class="post-modern-text">{{labels.TESTIMONY_3_TEXT|safe}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row row-50">
      <div class="col-12 text-center">
        <a class="button button-lg button-block section-dark" href="{{labels.NAVBAR_NAV_TESTIMONIALS_SLUG}}">Voir toutes
          les témoignages</a>
      </div>
    </div>
  </div>
</section>
