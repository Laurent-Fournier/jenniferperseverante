<!-- Families section -->
<style>
  /* ==========================================================
   BLOG FILTERS
   ========================================================== */

  .blog-filter-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
  }

  /* Petite introduction au-dessus des filtres */

  .blog-filter-heading {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  /* Liste */

  .blog-filters {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;

    margin: 0;
    padding: 0;

    gap: 8px;
  }

  /* Chaque filtre */

  .blog-filter {
    position: relative;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 40px;
    padding: 8px 17px;

    border: 1px solid rgba(40, 40, 40, 0.14);
    border-radius: 100px;

    background: rgba(255, 255, 255, 0.7);

    color: #555;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: 0.01em;

    text-decoration: none;

    transition:
      color 0.25s ease,
      background-color 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      transform 0.25s ease;
  }

  /* Hover */

  .blog-filter:hover {
    color: #222;
    background: #fff;
    border-color: rgba(40, 40, 40, 0.28);

    text-decoration: none;

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);

    transform: translateY(-1px);
  }

  /* Focus clavier */

  .blog-filter:focus {
    color: #222;
    text-decoration: none;
    outline: none;

    box-shadow:
      0 0 0 3px rgba(0, 0, 0, 0.06);
  }

  /* Filtre actif */

  .blog-filter.active {
    color: #fff;
    background: #292929;
    border-color: #292929;

    box-shadow:
      0 5px 18px rgba(0, 0, 0, 0.12);
  }

  .blog-filter.active:hover {
    color: #fff;
    background: #1f1f1f;
    border-color: #1f1f1f;

    transform: translateY(-1px);
  }

  /* Petit point décoratif sur le filtre actif */

  .blog-filter.active::before {
    content: "";

    width: 5px;
    height: 5px;

    margin-right: 7px;

    border-radius: 50%;
    background: currentColor;

    opacity: 0.75;
  }


  /* ==========================================================
   VERSION SOMBRE
   ========================================================== */

  .section-dark .blog-filter-eyebrow {
    color: rgba(255, 255, 255, 0.5);
  }

  .section-dark .blog-filter-title {
    color: rgba(255, 255, 255, 0.9);
  }

  .section-dark .blog-filter {
    color: rgba(255, 255, 255, 0.75);
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.16);
  }

  .section-dark .blog-filter:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .section-dark .blog-filter.active {
    color: #292929;
    background: #fff;
    border-color: #fff;
  }

  .section-dark .blog-filter.active:hover {
    color: #292929;
    background: #fff;
  }


  /* ==========================================================
   MOBILE
   ========================================================== */

  @media (max-width: 575.98px) {

    .blog-filter-wrapper {
      text-align: left;
    }

    .blog-filter-heading {
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .blog-filters {
      justify-content: flex-start;

      flex-wrap: nowrap;
      overflow-x: auto;

      margin-right: -15px;
      padding: 2px 15px 12px 0;

      -webkit-overflow-scrolling: touch;

      /* Firefox */
      scrollbar-width: thin;
    }

    .blog-filter {
      flex: 0 0 auto;
      white-space: nowrap;
    }


  }
</style>

<section class="section section-lg {% if section.style == 'odd' %}section-dark{% else %}section-light{% endif %}">
  <div class="container">
    <div class="row row-50">
      <div class="col-lg-12">

        <div class="blog-filter-wrapper">

          <h3>Nos articles par catégorie</h3><br>

          <nav class="blog-filters" aria-label="Filtrer les articles">

            <a href="/{{ lg }}/{{ article.slug }}" class="blog-filter {% if not request.GET.filter %}active{% endif %}">
              Tous
            </a>

            {% for family in families %}
            <a href="?filter={{ family.code|lower }}"
              class="blog-filter {% if request.GET.filter == family.code|lower %}active{% endif %}">
              {{ family.name }}
            </a>
            {% endfor %}

          </nav>

        </div>

      </div>
    </div>
  </div>
</section>
