<!-- Row Hero -->
<section class="section parallax-container breadcrumb-media-content"
  data-parallax-img="/images/1024/{{hero.image.src}}">
  <div class="parallax-content breadcrumbs-custom context-dark main-bunner-inner">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
          <h1>{{hero.title|safe}}</h1>
          {% if hero.subtitle %}<h3 class="offset-top-30">{{hero.subtitle|safe}}</h3>{% endif %}
          <ul class="breadcrumbs-custom-path">
            <li><a href="/{{lg}}/">{{labels.NAVBAR_NAV_HOME}}</a></li>
            {% if hero.nav %}
            <li class="active">{{hero.nav}}</li>
            {% endif %}
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
