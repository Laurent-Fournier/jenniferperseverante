<!-- Comments -->
<section class="section section-lg {% if section.style == 'odd'%}section-dark{% else %}section-light{% endif %}">
    <div class="container">
        <div class="row row-50">
            <div class="col-12 text-center">
                <h3>{{labels.COMMENTS_TITLE}}</h3>
                <img class="d-block mx-auto" src="/static/images/separator-star.svg">
            </div>
            {% if root_comments %}
            <div class="col-12 comments">
                {% for com in root_comments %}
                {% include 'widget_comment.html' with comment=com %}
                {% endfor %}
            </div>
            {% endif %}
            <div class="col-12">
                {% if not root_comments %}
                <p class="text-muted">{{labels.COMMENTS_NONE}}</p>
                {% endif %}
                <!-- Bouton Répondre : affiche le formulaire ci-dessous via JS -->
                <button type="button" class="btn btn-sm btn-outline-primary"
                    onclick="toggleReponse('reponse-form-0')">{{labels.BTN_WRITE}}</button>

                <!-- Formulaire de réponse : caché par défaut, pas d'URL dédiée nécessaire -->
                <form method="post" action="/{{lg}}/add-comment" id="reponse-form-0" style="display: none;"
                    class="mt-3 reponse-form">
                    {% csrf_token %}
                    <input type="hidden" id="art_id" name="art_id" value="{{article.id}}">
                    <input type="hidden" id="art_slug" name="art_slug" value="{{article.slug}}">
                    <input type="hidden" name="parent_id" value="">

                    <div class="form-group">
                        <label for="author-0">{{labels.COMMENT_FIELD_NAME}}</label>
                        <input type="text" class="form-control" id="author-0" name="author" required>
                    </div>
                    <div class="form-group">
                        <label for="email-0">{{labels.COMMENT_FIELD_EMAIL}}</label>
                        <input type="email" class="form-control" id="email-0" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="content-0">{{labels.COMMENT_FIELD_RESPONSE}}</label>
                        <textarea class="form-control" id="content-0" name="content" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-sm btn-primary">{{labels.BTN_SEND}}</button>
                    <p class="help">{{labels.COMMENTS_HELP}}</p>
                </form>
            </div>

        </div>
    </div>
</section>
