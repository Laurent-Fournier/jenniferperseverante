<!-- Newsletter subscription form -->
<section class="section section-lg section-main">
  <div class="container">
    <div class="row justify-content-md-center">
      <div class="col-md-12 col-lg-12">
        <form class="form-inline justify-content-center" data-form-type="subscribe" method="post"
          action="/{{lg}}/subscribe" name="subscribe">
          {% csrf_token %}
          <label for="email" class="mr-2 font-weight-bold">{{labels.NEWSLETTER_TEXT}}</label>
          <input type="email" class="form-control mr-2" id="email" name="email" placeholder="Email..." required>
          <button type="submit" class="btn" style="color: #fff; background-color: #000;"
            name="submit">{{labels.NEWSLETTER_ACTION}}</button>
        </form>
      </div>
    </div>
  </div>
</section>
