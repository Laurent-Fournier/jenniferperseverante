<!-- Contact form -->
<section class="section section-lg {% if section.style == 'odd'%}section-dark{% else %}section-light{% endif %}">
  <div class="container">
    <div class="row justify-content-md-center">
      <div class="col-md-9 col-lg-7">
        <h3 class="title-decorate title-decorate-center">{{labels.CONTACT_TITLE}}</h3>
        <p>{% autoescape off %}{{labels.CONTACT_CHAPO}}{% endautoescape %}</p>
        <p>{% autoescape off %}{{labels.CONTACT_SECURITY}}{% endautoescape %}</p>

        <form id="contact-us" class="rd-form" data-form-output="form-output-global" data-form-type="contact"
          method="post" action="/{{lg}}/add-contact">
          {% csrf_token %}
          <input type="hidden" id="contact_type" name="contact_type" value="generic">
          <input type="hidden" id="art_id" name="art_id" value="{{article.id}}">
          <input type="hidden" id="art_slug" name="art_slug" value="{{article.slug}}">
          <div class="row">
            <div class="col-md-6 form-input">
              <input type="text" class="form-control" id="name" name="name" placeholder="{{labels.CONTACT_FIELD_NAME}}">
            </div>
            <div class="col-md-6 form-input">
              <input type="email" class="form-control" id="email" name="email"
                placeholder="{{labels.CONTACT_FIELD_EMAIL}}" required>
            </div>
            <div class="col-md-12 form-input">
              <input type="text" class="form-control" id="subject" name="subject"
                placeholder="{{labels.CONTACT_FIELD_SUBJECT}}">
            </div>
            <div class="col-md-12 form-textarea">
              <textarea class="form-control" id="message" name="message" rows="6"
                placeholder="{{labels.CONTACT_FIELD_MESSAGE}}"></textarea>
            </div>
            <div class="col-md-12 form-btn text-center">
              <button type="submit" form="contact-us"
                class="button button-lg button-block section-dark button-dark">{{labels.CONTACT_SEND}}</button>
            </div>
          </div>
          <br>
        </form>
      </div>
    </div>
  </div>
</section>
