<!-- Home Hero section-->
<section class="section section-lg section-main-bunner">
  <div class="main-bunner-img" style="background-image: url(/images/1024/{{hero.image.src}}); background-size: cover;">
  </div>
  <div class="main-bunner-inner">
    <div class="container">
      <div class="row row-30 justify-content-lg-between align-items-lg-center">
        <div class="col-lg-9 col-xl-8 order-lg-1"><span class="bunner-location">{{labels.HOME_HERO_BUNNER}}</span>
          <h1>{{labels.HOME_HERO_TITLE}}</h1><span
            class="italic-subtitle offset-top-30">{{labels.HOME_HERO_SUBTITLE}}</span>
        </div>
      </div>
    </div>
  </div>
</section>
