<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{{article_title}} — Transbeauté</title>
</head>

<body style="margin:0; padding:0; background-color:#f7f4f2; font-family:Arial, Helvetica, sans-serif; color:#444444;">

   <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
      style="background-color:#f7f4f2; margin:0; padding:30px 0;">

      <tr>
         <td align="center">

            <!-- Main container -->
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
               style="max-width:600px; background-color:#ffffff;">

               <!-- Transbeauté header -->
               <tr>
                  <td style="padding:35px 40px 25px; text-align:center;">
                     <img src="https://tb-dev.beautifuldata.fr/static/images/logo-transbeaute-baseline-en-300.png">
                  </td>
               </tr>

               <!-- Article image -->
               <tr>
                  <td style="padding:0; text-align:center;">
                     <img src="{{cover_url}}" alt="{{article_title}}" width="600"
                        style="display:block; width:100%; max-width:600px; height:auto; border:0;">
                  </td>
               </tr>

               <!-- Article content -->
               <tr>
                  <td style="padding:35px 40px 40px; font-size:16px; line-height:1.7;">

                     <h1 style="margin:0 0 25px; font-size:24px; font-weight:normal; color:#c48c4c;">
                        Hello!
                     </h1>

                     <p style="margin:0 0 25px;">
                        Discover our latest article published on the Transbeauté website:
                     </p>

                     <h2 style="margin:0 0 15px; font-size:21px; line-height:1.4; font-weight:normal; color:#444444;">
                        {{article_title}}
                     </h2>

                     <p style="margin:0 0 30px; color:#666666;">
                        {{article_description}}
                     </p>

                     <!-- Read article button -->
                     <p style="text-align:center; margin:35px 0 15px;">
                        <a href="{{article_url}}"
                           style="display:inline-block; padding:13px 30px; background-color:#c48c4c; color:#ffffff; text-decoration:none; font-size:15px; border-radius:3px;">
                           Read the article
                        </a>
                     </p>

                  </td>
               </tr>

               <!-- Footer -->
               <tr>
                  <td
                     style="padding:25px 40px; background-color:#f3eeee; text-align:center; font-size:12px; line-height:1.6; color:#999999;">

                     <p style="margin:0;">
                        <a href="{{unsubscribe_url}}" style="color:#999999; text-decoration:underline;">
                           Unsubscribe
                        </a>
                     </p>

                  </td>
               </tr>

            </table>

         </td>
      </tr>

   </table>

</body>

</html>
